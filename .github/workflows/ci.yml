name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Mono (net472 tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete
      - run: dotnet restore IntegrationFlow.sln
      - run: dotnet build IntegrationFlow.sln --no-restore
      - run: dotnet test IntegrationFlow.sln --no-build --filter "Category!=Integration"

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Mono (net472 tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete
      - run: dotnet restore IntegrationFlow.sln
      - run: dotnet build IntegrationFlow.sln --no-restore
      - run: dotnet test IntegrationFlow.sln --no-build --filter "Category=Integration"

  pack:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore IntegrationFlow.sln
      - run: dotnet build IntegrationFlow.sln -c Release --no-restore
      - run: dotnet pack IntegrationFlow.sln -c Release --no-build -o ./artifacts -p:Version=1.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
